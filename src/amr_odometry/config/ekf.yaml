ekf_filter_node:
  ros__parameters:
    frequency: 30.0               # Tần suất cập nhật của bộ lọc EKF
    sensor_timeout: 0.2      
    two_d_mode: true              # Chế độ 2D (chỉ sử dụng x, y, yaw)
    publish_acceleration: false   
    publish_tf: true              # TF: odom -> base_link
    print_diagnostics: true       
    reset_on_time_jump: true      # Tự động reset bộ lọc khi có nhảy thời gian lớn

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom             # Kết quả EKF nằm trong hệ tọa độ local odom

    odom0: /wheel/odom      # Dữ liệu odometry từ bánh xe
    odom0_config: [false, false, false,       # x, y, z
                   false, false, false,       # roll, pitch, yaw
                   true,  false, false,       # vx, vy, vz
                   false, false, true,        # vroll, vpitch, vyaw
                   false, false, false]       # ax, ay, az
    odom0_queue_size: 10             
    odom0_differential: false    
    odom0_relative: false             

    imu0: /imu/data_raw     # Dữ liệu IMU thô từ MPU6050
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
