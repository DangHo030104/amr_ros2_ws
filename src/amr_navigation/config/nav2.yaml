    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false


# controller_server: Tạo lệnh vận tốc cho robot bám đường 
controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 10.0            # Tần số điều khiển 10Hz -> 0.1s để robot nhận lệnh vận tốc mới
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3                # Sai số cho phép

    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]

    # Các plugin kiểm tra tiến trình và kiểm tra mục tiêu của robot.
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"   
      # Mục tiêu robot di chuyển ít nhất 0.1m trong 10s
      required_movement_radius: 0.10
      movement_time_allowance: 10.0

    # Kiểm tra robot có đủ gần mục tiêu để dừng lại hay chưa, dựa trên sai số vị trí và hướng. hf
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10     # Sai số vị trí cho phép
      yaw_goal_tolerance: 0.15    # Sai số hướng cho phép
      stateful: true

    # DWB (Dynamic Window Based Controller) tạo và đánh giá các quỹ đạo cục bộ cho robot vi sai
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      # Giới hạn vận tốc của robot
      min_vel_x: 0.0
      max_vel_x: 0.20
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.80

      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0

      # Giới hạn gia tốc/giảm tốc của robot
      acc_lim_x: 0.15       
      acc_lim_y: 0.0
      acc_lim_theta: 0.80

      decel_lim_x: -0.15
      decel_lim_y: 0.0
      decel_lim_theta: -0.80

      # Lấy mẫu các vận tốc trong khoảng thời gian 1.5s để đánh giá quỹ đạo
      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.5

      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.20
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.02                  # Đánh giá quỹ đạo so với chi phí vật cản
      PathAlign.scale: 32.0                     # Ưu tiên hướng chuyển động phù hợp với đường
      PathAlign.forward_point_distance: 0.10  
      GoalAlign.scale: 24.0                     # Ưu tiên hướng phù hợp với mục tiêu
      GoalAlign.forward_point_distance: 0.10
      PathDist.scale: 32.0                      # Ưu tiên quỹ đạo gần đường
      GoalDist.scale: 24.0                      # Ưu tiên tiến gần đích
      RotateToGoal.scale: 32.0                  # Hỗ trợ quay đúng hướng khi gần đích
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0


# Local Costmap: Môi trường xung quanh robot
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0           # Cập nhật Costmap 5 lần/giây
      publish_frequency: 2.0          # Xuất bản Costmap 2 lần/giây
      always_send_full_costmap: true  # Luôn gửi toàn bộ bản đồ chi phí khi pub
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05

      # Kích thước thực tế: dài 0.180 m, rộng khoảng 0.242 m tính cả bánh.
      footprint: "[[-0.090, -0.121], [-0.090, 0.121], [0.090, 0.121], [0.090, -0.121]]"
      footprint_padding: 0.01     # Bổ sung thêm 1 cm để tránh va chạm với vật cản

      # Robot chỉ dùng LaserScan 2D nên không cần voxel layer.
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true            # Xóa dấu vật cản trên các tia được xác nhận thông thoáng
          marking: true             # Đánh dấu vật cản được phát hiện
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.15    
          obstacle_max_range: 2.5     
          raytrace_min_range: 0.15   
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30
        cost_scaling_factor: 1.0    # Tăng hệ số này sẽ làm cho robot tránh xa vật cản hơn.


# Global Costmap: Bản đồ phục vụ tìm đường
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      always_send_full_costmap: true  # Luôn gửi toàn bộ bản đồ chi phí khi pub
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true       # Theo dõi các vùng chưa biết trong bản đồ, đánh dấu là vật cản
      footprint: "[[-0.090, -0.121], [-0.090, 0.121], [0.090, 0.121], [0.090, -0.121]]"   
      footprint_padding: 0.01     # Bổ sung thêm 1 cm để tránh va chạm với vật cản.

      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_min_range: 0.15
          obstacle_max_range: 2.5
          raytrace_min_range: 0.15
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.30
        cost_scaling_factor: 1.0    # Tăng hệ số này sẽ làm cho robot tránh xa vật cản hơn     


# map_server: Đọc và phát bản đồ đã lưu từ file YAML
map_server:
  ros__parameters:
    use_sim_time: false
    # Đường dẫn map được truyền từ đối số map của navigation.launch.py.
    yaml_filename: ""


# map_saver: Lưu bản đồ hiện tại ra file YAML
map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true 


# planner_server: Tính đường đi
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0     # Tốc độ tính toán đường đi 
    planner_plugins: [GridBased]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.15         # Khoảng cách tối thiểu từ robot đến mục tiêu để coi là đã đến đích
      use_astar: true         # false: Dijkstra / true: A* 
      allow_unknown: true     # Cho phép robot đi vào vùng chưa biết trong bản đồ (unknown) khi tìm đường


# Smoother Server: Làm mượt đường đi
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10         # Ngưỡng hội tụ của thuật toán
      max_its: 500               # Giới hạn số lần lặp
      do_refinement: true


# behavior_server: Điều phối hành vi của robot
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.20
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.80
    min_rotational_vel: 0.15
    rotational_acc_lim: 0.80


# waypoint_follower: Theo dõi các điểm dừng trong danh sách waypoint
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 10
    stop_on_failure: false      # Nếu waypoint hiện tại lỗi, tiếp tục đến waypoint tiếp theo
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200


# velocity_smoother: Làm mượt lệnh vận tốc trước khi gửi tới robot
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP

    # Đồng bộ với robot_cfg.h, serial_comm.c và serial_bridge.yaml.
    max_velocity: [0.20, 0.0, 0.80]
    min_velocity: [-0.20, 0.0, -0.80]
    max_accel: [0.15, 0.0, 0.80]
    max_decel: [-0.15, 0.0, -0.80]
    odom_topic: /odom
    odom_duration: 0.20
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5


# robot_state_publisher: Phát các frame của robot dựa trên URDF
robot_state_publisher:
  ros__parameters:
    use_sim_time: false
