# Cấu hình Nav2 cho robot AMR hai bánh vi sai.


# AMCL: Localization 
amcl:
  ros__parameters:
    use_sim_time: false

    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    tf_broadcast: true        # Cho phép AMCL phát TF map → odom
    transform_tolerance: 1.0  # Timeout để nhận TF map → odom

    # Mô hình chuyển động Odometry cho robot 2 bánh vi sai.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Mô hình đo của LiDAR A1M8.
    laser_model_type: likelihood_field    # So sánh điểm quét với k/c tới vật cản gần nhất trong bản đồ ("likelihood_field" hoặc "beam")
    laser_min_range: 0.15
    laser_max_range: 8.0
    laser_likelihood_max_dist: 2.0        # Giới hạn k/c đo để đánh giá xác suất đo trúng vật cản (hit)
    max_beams: 60                         # Lấy mẫu tối đa khoảng 60 tia quét để đánh giá mỗi hạt (particle)
    do_beamskip: false
    sigma_hit: 0.2
    lambda_short: 0.1
    z_hit: 0.5          # Tỷ lệ xác suất đo trúng vật cản (hit)
    z_short: 0.05
    z_max: 0.05         
    z_rand: 0.5         # Tỷ lệ xác suất đo ngẫu nhiên (random)

    # Số hạt dùng để ước lượng vị trí robot.
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1        # Số lần nhận scan mới để resample hạt (1 = resample mỗi scan, 2 = resample mỗi 2 scan, ...)
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    # Điều kiện cập nhật vị trí AMCL
    update_min_d: 0.20          # 0.2 m
    update_min_a: 0.20          # 0.2 rad 
    save_pose_rate: 0.5         # Tần suất lưu pose hiện tại của robot để dùng lại 


# bt_navigator: Điều phối nhiệm vụ điều hướng (Nav2) bằng Behavior Tree.
